<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Материалы</title>
    <script src="telegram-web-app.js"></script>
    <style>
        :root { color-scheme: light dark; font-family: Inter, system-ui, sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: #f3f5f8; color: #1d2733; }
        .viewer-shell { min-height: 100vh; display: flex; flex-direction: column; }
        .viewer-toolbar {
            display: flex; align-items: center; gap: 10px; padding: max(12px, env(safe-area-inset-top)) 14px 12px;
            background: #fff; border-bottom: 1px solid #dfe5eb; position: sticky; top: 0; z-index: 2;
        }
        .viewer-title { flex: 1; min-width: 0; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .viewer-button {
            min-height: 40px; border: 1px solid #ccd5df; border-radius: 10px; padding: 9px 12px;
            background: #fff; color: #1d2733; text-decoration: none; font-size: 13px; font-weight: 700; cursor: pointer;
        }
        .viewer-button.primary { border-color: #2481cc; background: #2481cc; color: #fff; }
        .viewer-content { flex: 1; min-height: 0; display: flex; align-items: stretch; justify-content: center; }
        .viewer-frame { width: 100%; min-height: calc(100vh - 66px); border: 0; background: #fff; }
        .viewer-image { max-width: 100%; height: auto; align-self: flex-start; padding: 16px; }
        .viewer-text { width: min(920px, 100%); margin: 0; padding: 22px; white-space: pre-wrap; overflow-wrap: anywhere; }
        .viewer-message { margin: auto; max-width: 560px; padding: 32px 20px; text-align: center; color: #65717e; }
        @media (prefers-color-scheme: dark) {
            body { background: #111820; color: #edf2f7; }
            .viewer-toolbar, .viewer-button { background: #1b2530; color: #edf2f7; border-color: #344250; }
            .viewer-frame { background: #fff; }
        }
    </style>
</head>
<body>
<main class="viewer-shell">
    <header class="viewer-toolbar">
        <button class="viewer-button" id="viewerBack" type="button">← Назад</button>
        <strong class="viewer-title" id="viewerTitle">Материалы</strong>
        <a class="viewer-button primary" id="viewerDownload" href="#">Скачать</a>
    </header>
    <section class="viewer-content" id="viewerContent" aria-live="polite"></section>
</main>
<script src="viewer.js"></script>
</body>
</html>
